[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-memory"
version = "0.1.0"
description = "Long-term memory engine for LangGraph over any BaseStore — LLM fact extraction, consolidation, and recall ranked by semantic similarity, recency and importance (a maintained alternative to LangMem)"
authors = [{name = "Kamal", email = "skamalj@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain>=1.0",
]
keywords = ["langgraph", "memory", "long-term-memory", "agent-memory", "langmem", "basestore", "extraction", "recall"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/skamalj/langgraph-memory"
Repository = "https://github.com/skamalj/langgraph-memory.git"
Documentation = "https://skamalj.github.io/agentstate-reducer/"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "langgraph-store-core>=0.1.1",
    "langgraph-store-postgres>=0.1.0",
    "langgraph-store-dynamodb>=0.2.1",
    "agentstate-reducer>=0.4.0",
    "langgraph-dynamodb-checkpoint>=0.4.1",
    "langchain-aws",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_memory"]
